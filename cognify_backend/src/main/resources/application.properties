spring.application.name=cognify
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cognify}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
cognify.jwt-secret=${JWT_SECRET}
server.error.include-message=never
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=0

cognify.mail-enabled=${MAIL_ENABLED:false}
cognify.mail-from=${MAIL_FROM:}
cognify.frontend-url=${FRONTEND_URL:http://localhost:3000}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

cognify.payments.test-enabled=${TEST_PAYMENTS_ENABLED:false}

cognify.ai.mode=${AI_MODE:disabled}
cognify.ai.key=${OPENAI_API_KEY:}
cognify.ai.model=${OPENAI_MODEL:gpt-4.1-mini}
cognify.ai.base=${OPENAI_BASE_URL:https://api.openai.com/v1}
cognify.generation.worker-enabled=${GENERATION_WORKER_ENABLED:true}
